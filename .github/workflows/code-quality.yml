name: Code Quality

on:
  push:
    branches: [typescript]
  pull_request:
    branches: [typescript]
  workflow_dispatch:
    inputs:
      heaven_style_branches:
        description: Space- or comma-separated branches that must contain identical heaven-style trees
        required: false
        default: python typescript

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HEAVEN_STYLE_BRANCHES: ${{ inputs.heaven_style_branches || vars.HEAVEN_STYLE_BRANCHES || 'python typescript' }}
      HEAVEN_STYLE_CURRENT_BRANCH: typescript
      HEAVEN_STYLE_FETCH_REMOTE: origin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
