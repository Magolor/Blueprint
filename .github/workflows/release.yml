name: Prepare template release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref_name == 'typescript'
    runs-on: ubuntu-latest
    env:
      HEAVEN_STYLE_CURRENT_BRANCH: typescript
      HEAVEN_STYLE_FETCH_REMOTE: origin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: typescript
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/release.bash
      - uses: actions/upload-artifact@v7
        with:
          name: blueprint-typescript-template
          path: .temp/release/*
          if-no-files-found: error
          retention-days: 14
