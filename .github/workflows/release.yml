name: Release

on:
  push:
    branches: [release]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install build tooling
        run: uv pip install --system build twine

      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: blueprint-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  test-dist:
    name: Test installed artifact (${{ matrix.os }})
    needs: build
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: blueprint-dist
          path: dist

      - name: Install built wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Verify installed artifact
        run: python -c "import blueprint; print(blueprint.__version__)"

      - name: Verify CLI entry points
        shell: bash
        run: |
          blueprint --help
          blueprint-gui --help

  publish-pypi:
    name: Publish to PyPI
    needs: test-dist
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blueprint-dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
