name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified distributions to PyPI
        required: true
        type: boolean
        default: false
      heaven_style_branches:
        description: Space- or comma-separated branches that must contain identical heaven-style trees
        required: false
        default: python typescript

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    if: github.ref_name == 'python'
    runs-on: ubuntu-latest
    env:
      HEAVEN_STYLE_BRANCHES: ${{ inputs.heaven_style_branches || vars.HEAVEN_STYLE_BRANCHES || 'python typescript' }}
      HEAVEN_STYLE_CURRENT_BRANCH: python
      HEAVEN_STYLE_FETCH_REMOTE: origin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - run: uv sync --all-extras --frozen
      - run: bash scripts/check.bash full
      - run: uv build
      - run: uv run --with twine twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: blueprint-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  test-dist:
    name: Test installed artifact (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: blueprint-dist
          path: dist

      - name: Install built wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Verify installed artifact
        run: python -c "import blueprint; print(blueprint.__version__)"

      - name: Verify CLI entry points
        run: bp --help

  publish-pypi:
    name: Publish to PyPI
    needs: test-dist
    if: inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: blueprint-dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
