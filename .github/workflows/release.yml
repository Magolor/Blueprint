name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-source:
    name: Verify immutable release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify version, annotated tag, and master commit
        shell: bash
        run: |
          set -euo pipefail

          version="$(python -c 'from pathlib import Path; namespace = {}; exec(Path("src/blueprint/version.py").read_text(encoding="utf-8"), namespace); print(namespace["__version__"])')"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Package version '${version}' is not a stable MAJOR.MINOR.PATCH.N release version." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not exactly match src/blueprint/version.py (${version})." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/tags/${GITHUB_REF_NAME}" ]]; then
            echo "Release workflow must run from an exact tag ref; received ${GITHUB_REF}." >&2
            exit 1
          fi

          git fetch --force --no-tags origin \
            refs/heads/master:refs/remotes/origin/master \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          if ! git show-ref --verify --quiet "${tag_ref}"; then
            echo "Release ref ${tag_ref} is not available in the checkout." >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "${tag_ref}")" != "tag" ]]; then
            echo "Release ref ${tag_ref} is lightweight; an annotated tag object is required." >&2
            exit 1
          fi

          tagged_commit="$(git rev-parse "${tag_ref}^{commit}")"
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          master_commit="$(git rev-parse refs/remotes/origin/master^{commit})"
          if [[ "${tagged_commit}" != "${event_commit}" ]]; then
            echo "Annotated tag resolves to ${tagged_commit}, but the workflow event resolves to ${event_commit}." >&2
            exit 1
          fi
          if [[ "${tagged_commit}" != "${master_commit}" ]]; then
            echo "Tagged commit ${tagged_commit} is not current origin/master ${master_commit}." >&2
            exit 1
          fi

  source-gate:
    name: Full source gate on Python ${{ matrix.python-version }}
    needs: verify-source
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Synchronize the locked environment
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        shell: bash
        run: |
          uv sync --all-extras --frozen --python "${EXPECTED_PYTHON}"
          uv run python -c 'import os, sys; expected = tuple(map(int, os.environ["EXPECTED_PYTHON"].split("."))); actual = sys.version_info[:2]; assert actual == expected, (actual, expected)'

      - name: Verify generated environment files
        run: bash scripts/sync-env.bash --check --no-heavenbase

      - name: Run the full repository gate
        run: bash scripts/check.bash full

  build:
    name: Build tagged distributions
    needs: [verify-source, source-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set a reproducible build timestamp
        shell: bash
        run: |
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct HEAD)" >> "${GITHUB_ENV}"

      - name: Install build tooling
        run: uv pip install --system build twine

      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel

      - name: Check distribution metadata and inventory
        shell: bash
        run: |
          python -m twine check dist/*
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [[ ${#wheels[@]} -ne 1 || ${#sdists[@]} -ne 1 ]]; then
            echo "Expected exactly one wheel and one source distribution." >&2
            printf 'wheel: %s\n' "${wheels[@]:-none}" >&2
            printf 'sdist: %s\n' "${sdists[@]:-none}" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: blueprint-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  test-dist:
    name: Test ${{ matrix.kind }} on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: wheel
            pattern: "*.whl"
          - os: macos-latest
            kind: wheel
            pattern: "*.whl"
          - os: windows-latest
            kind: wheel
            pattern: "*.whl"
          - os: ubuntu-latest
            kind: sdist
            pattern: "*.tar.gz"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: blueprint-dist
          path: dist

      - name: Select the distribution
        id: package
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/${{ matrix.pattern }})
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "Expected exactly one ${{ matrix.kind }} artifact." >&2
            exit 1
          fi
          printf 'path=%s\n' "${files[0]}" >> "${GITHUB_OUTPUT}"

      - name: Install the distribution
        run: python -m pip install "${{ steps.package.outputs.path }}"

      - name: Verify installed version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os, blueprint; expected = os.environ['RELEASE_TAG'].removeprefix('v'); assert blueprint.__version__ == expected, (blueprint.__version__, expected)"

      - name: Verify CLI entry points
        shell: bash
        run: |
          bp --version
          bp --help
          blueprint-gui --help

  github-release:
    name: Publish GitHub Release
    needs: [build, test-dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blueprint-dist
          path: dist

      - name: Create or verify the immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob

          artifacts=(dist/*)
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [[ ${#artifacts[@]} -ne 2 || ${#wheels[@]} -ne 1 || ${#sdists[@]} -ne 1 ]]; then
            echo "Expected exactly one wheel and one source distribution." >&2
            exit 1
          fi

          title="Blueprint ${GITHUB_REF_NAME#v}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            mkdir existing-release
            gh release download "${GITHUB_REF_NAME}" --dir existing-release
            existing=(existing-release/*)
            if [[ ${#existing[@]} -ne 2 ]]; then
              echo "Existing release must contain exactly two immutable distribution assets; found ${#existing[@]}." >&2
              exit 1
            fi
            for artifact in "${artifacts[@]}"; do
              name="$(basename -- "${artifact}")"
              published="existing-release/${name}"
              if [[ ! -f "${published}" ]]; then
                echo "Existing release is missing immutable asset ${name}." >&2
                exit 1
              fi
              if ! cmp -s "${artifact}" "${published}"; then
                echo "Existing release asset ${name} differs byte-for-byte from the validated build." >&2
                exit 1
              fi
            done
            echo "Existing release assets are byte-identical; leaving the release unchanged."
          else
            gh release create "${GITHUB_REF_NAME}" "${artifacts[@]}" \
              --verify-tag \
              --generate-notes \
              --title "${title}"
          fi
