name: Prepare template release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref_name == 'python'
    runs-on: ubuntu-latest
    env:
      HEAVEN_STYLE_CURRENT_BRANCH: python
      HEAVEN_STYLE_FETCH_REMOTE: origin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: python
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: bash scripts/release.bash
      - uses: actions/upload-artifact@v7
        with:
          name: blueprint-python-template
          path: .temp/release/*
          if-no-files-found: error
          retention-days: 14
