name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package to npm
        required: true
        type: boolean
        default: false
      heaven_style_branches:
        description: Space- or comma-separated branches that must contain identical heaven-style trees
        required: false
        default: python typescript

permissions:
  contents: read

jobs:
  verify:
    if: github.ref_name == 'typescript'
    runs-on: ubuntu-latest
    env:
      HEAVEN_STYLE_BRANCHES: ${{ inputs.heaven_style_branches || vars.HEAVEN_STYLE_BRANCHES || 'python typescript' }}
      HEAVEN_STYLE_CURRENT_BRANCH: typescript
      HEAVEN_STYLE_FETCH_REMOTE: origin
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: mkdir -p artifacts && pnpm pack --pack-destination artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: blueprint-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: inputs.publish
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm publish --access public --provenance
